# Copies of the install-windows-install, install-windows-config,
# install-windows-cli and e2e-windows jobs of ci.yaml, for a run of just
# those four jobs: dispatch this workflow on a branch for an early Windows
# result. The jobs in ci.yaml are the definition. A change to a
# Windows job there is made in this file in the same commit. The job names
# differ from the check names ci.yaml reports on purpose: a run of this
# workflow never stands in for a full run of ci.yaml, which a merge requires.
name: ci-windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-windows-install-early:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Informational: names the host and nothing gates on it. Prints the model
      # name and the number of logical processors of each processor socket. A
      # query error is not shown and does not fail the step, so a runner
      # without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Format-List Name, NumberOfLogicalProcessors
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: install-windows-install
          restore-from: install-windows-cli
      - run: go test -race -count=1 -run TestWindows ./install/

  install-windows-config-early:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Informational: names the host and nothing gates on it. Prints the model
      # name and the number of logical processors of each processor socket. A
      # query error is not shown and does not fail the step, so a runner
      # without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Format-List Name, NumberOfLogicalProcessors
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: install-windows-config
      - run: go test -race -count=1 ./internal/config/
      - run: go test -race -count=1 ./internal/telemetry/ ./internal/telemetrysend/ ./internal/fsacl/ ./internal/commands/telemetrycmd/
      # The test helpers for the Windows differences: -v prints each test and
      # the log shows which Windows branches of the helpers ran and which
      # skipped.
      - run: go test -race -count=1 -v ./internal/testfs/
      - run: go test -race -count=1 -v -run 'TestRenameOverAnOpenTarget|TestRemoveOfAnOpenFile|TestReadsRetryASharingViolation|TestShareRetryLeavesOtherErrorsAlone|TestConcurrentWritersOfOneFile|TestReadsDuringReplace|TestRootReadsDuringRootReplace' ./internal/config/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  install-windows-cli-early:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Informational: names the host and nothing gates on it. Prints the model
      # name and the number of logical processors of each processor socket. A
      # query error is not shown and does not fail the step, so a runner
      # without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Format-List Name, NumberOfLogicalProcessors
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: install-windows-cli
      - run: go test -race -count=1 -run 'TestRecordingAddsTheListedOperationsToThePluginHit|TestARecordedRunReadsTheFactsFileOnce|TestTheFirstLoginReadsAndWritesTheFactsFileAndNothingElse|TestTheFileOperationsOfAPluginSignInAreTheListed|TestTheFileOperationsOfAFirstPluginRunAreTheListed|TestTelemetryOffAlwaysWinsOverUpload|TestDevBuildsHonorExperiments|TestExecPluginRunsNeverUpload|TestReleaseBuildsIgnoreExperiments|TestNoUploadWithoutAnEndpoint|TestUploadURLRules|TestPassFileOfThisRunIsSent|TestPassRemovesAnOldHourWhenItsWriteOutlastsTheReadLimit|TestUploadStaysInTheDeadline|TestUploadNeverChangesTheRun|TestUploadSendsNoCredential|TestDebugLinesShowOnlyCountsOriginAndAnswer|TestARecordedRunWithTheExperimentReadsTheStateOnce|TestUploadExcludedNamesRegisteredCommands|TestTheControlsFunctionTakesNoLock|TestUploadCommandRefusals|TestUploadCommandIgnoresTheHourlyLimit|TestUploadCommandSendsTheCurrentHour|TestUploadCommandWithNoConfigDirectory|TestUploadCommandSharesTheLock|TestUploadCommandIsBounded|TestUploadCommandOutput|TestDebugLinesOfTheUploadCommand|TestUploadCommandRecordsNothing|TestUploadCommandSendsNoCredential|TestUploadCommandTakesNoConfigLock|TestUploadCommandReportsFailures|TestUploadCommandUnderReadOnly|TestUploadCommandBoundIsTheTelemetryBound|TestLinesWithNoChosenCommandRecordNothing|TestNoConfigDirectoryRecordsNothingAndCreatesNone|TestTelemetryExcludedHasExactlyTheSevenCommands|TestEveryRegisteredCommandRecordsOrIsExcluded|TestSubcommandCompletionTelemetryGroup' ./internal/cli/
      - run: go test -run '^$' -bench 'BenchmarkPluginHit$' -benchtime 200x -count 10 ./internal/cli/
      - run: go test -race -count=1 -run 'TestOneRelativeSpelling|TestOneDirectoryReachedBy|TestCopiedDirectory|TestHotPathOperationCounts|TestACrashBetweenTheTwoHalves|TestEveryExecPluginRemedyIsWrittenForTheInvocation|TestLookupStoredLoginOutcomes|TestNoTerminalLoginNamesTheEntryTheKubeconfigIdentifies|TestGetTokenStoreConflictNamesTheRegenerateSteps|TestTheExecPluginNamesTheRemediesWithoutATerminal' ./internal/token/
      - run: go test -race -count=1 -run 'TestExecCommand|TestKubeconfigRecords|TestKubeconfigNotices|TestKubeconfigInstallHint|TestKubeconfigLookup|TestKubeconfigReuses|TestKubeconfigEntryName' ./internal/engine/kubeconfig/
      - run: go test -race -count=1 -run '^Test(WatchObject|ListObject|WaitObject)' ./internal/client/provider/
      # The printed commands, pasted into pwsh and Windows PowerShell 5.1
      # from a .ps1 file.
      - run: go test -count=1 -run 'TestExactValuePaste(Pwsh|PowerShell51)$' ./test/conformance/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  e2e-windows-early:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Informational: names the host and nothing gates on it. Prints the model
      # name and the number of logical processors of each processor socket. A
      # query error is not shown and does not fail the step, so a runner
      # without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Format-List Name, NumberOfLogicalProcessors
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: e2e-windows
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: bash scripts/e2e
        timeout-minutes: 25
      - run: go test -count=1 -v -run TestPwsh ./internal/cli/completions/
        timeout-minutes: 10
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}
