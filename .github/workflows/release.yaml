name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Draft-release creation and asset upload.
      contents: write
      # GitHub-native build provenance (actions/attest-build-provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache restore anywhere on the release path — neither Go
          # modules here nor envtest assets for make e2e below: caches are
          # writable from PR/main runs, and a poisoned entry could reach
          # release artifacts (zizmor cache-poisoning). Modules are
          # re-verified via the sumdb; envtest re-downloads (~30s).
          cache: false
      - uses: ./.github/actions/setup-tools
      - run: make validate
      - run: make e2e
      - name: Build release matrix
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 linux/s390x darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" VERSION="$TAG" ./scripts/build
            mv "bin/rancher${ext}" "dist/rancher-${goos}-${goarch}${ext}"
            mv "bin/rancher-credential-vault${ext}" "dist/rancher-credential-vault-${goos}-${goarch}${ext}"
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/rancher-*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" --draft $prerelease --verify-tag --title "$TAG" dist/*
