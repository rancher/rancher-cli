name: release

# A tag push runs zizmor, then validate, then publish. publish attests the
# build and creates a draft release that holds every asset, with the tag as
# its title. The draft is reviewed, the reviewed notes are pasted into it,
# and then it is published; the notes go in before publishing because
# watchers' notifications and the releases feed carry the body as it is at
# publish. A published release takes no new assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two runs for one tag (a re-run, or a tag pushed again) must not both see
# zero existing releases and both create one - tag_name v0.1.0-alpha.1
# carried two releases on 2026-08-12 from exactly that race.
# cancel-in-progress stays false: the queued run must still run and take
# release-upsert's idempotent upload branch, not vanish.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Static analysis of the workflows on the tagged commit, before any step
  # that runs third-party code. A finding stops the release.
  zizmor:
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yaml

  # No write permissions here: this job pulls third-party code (apt
  # packages, golangci-lint, envtest binaries) before anything is trusted
  # with contents/id-token/attestations access.
  validate:
    needs: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce release tag grammar
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-tag "$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache restore anywhere on the release path - neither Go
          # modules here nor envtest assets for make e2e below: caches are
          # writable from PR/main runs, and a poisoned entry could reach
          # release artifacts (zizmor cache-poisoning). Modules are
          # re-verified via the sumdb; envtest re-downloads (~30s).
          cache: false
      - uses: $/.github/actions/setup-tools
      - run: make validate
      - run: make e2e

  # Only checkout, build, attest, and upload run with write access - no
  # third-party installs (apt, lint tooling, envtest) execute in a job that
  # holds contents/id-token/attestations permissions.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Draft-release creation and asset upload.
      contents: write
      # GitHub-native build provenance (actions/attest-build-provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # See validate's setup-go: same cache-poisoning rationale applies
          # here, in the job that actually holds the write permissions.
          cache: false
      - name: Build release matrix
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # Asset names must match install.sh's CLI_ASSET/HELPER_ASSET construction - the two lists stay in lockstep.
          for platform in linux/amd64 linux/arm64 linux/s390x darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" VERSION="$TAG" ./scripts/build
            mv "bin/rancher${ext}" "dist/rancher-${goos}-${goarch}${ext}"
            mv "bin/rancher-credential-vault${ext}" "dist/rancher-credential-vault-${goos}-${goarch}${ext}"
          done
          # install.sh ships as a versioned release asset too: checksummed
          # and attested like the binaries. raw@main stays the canonical
          # living copy; this is the pinned, auditable one.
          cp install.sh install.ps1 dist/
          # The schema manifest of this exact build is a release asset: it
          # lists the command and flag names the build's events can carry.
          # The runner's own binary writes it, with a throwaway config
          # directory and the file credential store so no real keychain or
          # config directory is touched.
          RANCHER_CLI_CONFIG_DIR="$(mktemp -d)" RANCHER_CLI_CREDENTIAL_STORE=file \
            dist/rancher-linux-amd64 schema --all -o json > dist/rancher-schema.json
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/rancher-*
            dist/install.sh
            dist/install.ps1
      - name: Create draft release or attach assets to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/release-upsert dist/*
