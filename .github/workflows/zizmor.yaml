name: zizmor

# Static analysis of the workflows themselves (rancher/rancher convention).
# The release workflow calls it before any build step.
on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/**"]
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Code-scanning SARIF upload needs GitHub Advanced Security, which
          # internal-visibility repos don't have - findings gate the job via
          # exit code and surface as PR annotations instead. When the repo
          # goes public, flip advanced-security to true, drop annotations,
          # and restore the job-level `security-events: write` permission.
          advanced-security: false
          annotations: true
