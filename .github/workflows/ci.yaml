name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push run gets a group of its own commit. With a group of the ref, a
# third push to main would cancel the push run still waiting, and that run
# would never finish or save its caches. Other runs share the group of their
# ref: a dispatch waits its turn behind the run in progress on its branch, and
# a new pull request run cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ci-windows.yaml carries copies of the four Windows jobs below
# (install-windows-install, install-windows-config, install-windows-cli and
# e2e-windows) for a run of just those four. Its job names differ from the
# check names this workflow reports. A run of it never replaces a full run
# of this workflow: a merge requires the full run.
# A change to a Windows job here is made in the copy in the same commit.
# The copies carry no needs and no if: that workflow has no reuse job.
jobs:
  # A push run of a commit that already has a successful manual run
  # (workflow_dispatch) of this workflow, started within the last 24 hours,
  # skips every other job and ends green. Otherwise every job runs. Every job
  # also runs when any lookup here fails. The two runs test the same thing: a
  # manual run uses the workflow file of its own commit and a push run the
  # file of the pushed commit; for the same commit that is the same workflow
  # file, the same scripts and the same tree. Only the concurrency group and
  # the cache saves differ by event. Pull request runs test a merge ref and
  # are never reused. The first push run of each UTC day, when main has no
  # cache entry of the day yet, runs in full and saves the caches that only a
  # main push saves. The check for a cache entry of the day looks at the
  # go-cache entries only: a push run that skips its jobs and changes an
  # input of any cache key (go.sum, the Go version, scripts/e2e for the
  # envtest key, go.mod for the setup-go key) leaves main without that entry
  # until the first push run of the next UTC day. Runs in between restore an
  # older entry, which is slower and still correct.
  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # lists the workflow runs and caches of this repository
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          # The go-cache names of the jobs that save a cache.
          SAVING_JOBS: lint test-1 conformance e2e install-windows-config install-windows-cli e2e-windows
        run: |
          set -u
          finish() {
            printf 'reuse=%s\n' "$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          sha="${GITHUB_SHA:-}"
          repo="${GITHUB_REPOSITORY:-}"
          [ "${GITHUB_EVENT_NAME:-}" = push ] || finish false
          [ -n "$sha" ] && [ -n "$repo" ] && [ -n "${SAVING_JOBS:-}" ] || finish false
          now="$(date -u +%s)"
          today="$(date -u +%Y-%m-%d)"

          runs="$(timeout 60 gh api "repos/$repo/actions/workflows/ci.yaml/runs?event=workflow_dispatch&head_sha=$sha&status=success&per_page=100")" || {
            echo "::warning::could not list the manual runs of ci.yaml; every job runs"
            finish false
          }
          found="$(printf '%s' "$runs" | jq -r --arg sha "$sha" --argjson now "$now" '
            [.workflow_runs[]
              | select((.path == ".github/workflows/ci.yaml" or ((.path // "") | startswith(".github/workflows/ci.yaml@")))
                and .event == "workflow_dispatch"
                and .head_sha == $sha
                and .status == "completed"
                and .conclusion == "success"
                and ((.created_at | type) == "string")
                and ((.created_at | fromdateiso8601) > ($now - 86400)))]
            | sort_by(.created_at) | reverse | .[0] // empty
            | "\(.id) \(.html_url)"')" || {
            echo "::warning::could not parse the list of manual runs of ci.yaml; every job runs"
            finish false
          }
          [ -n "$found" ] || finish false

          caches="$(timeout 60 gh api "repos/$repo/actions/caches?ref=refs/heads/main&sort=created_at&direction=desc&per_page=100")" || {
            echo "::warning::could not list the caches saved on the main branch; every job runs"
            finish false
          }
          printf '%s' "$caches" | jq -e '.actions_caches | type == "array"' > /dev/null || {
            echo "::warning::could not parse the list of caches saved on the main branch; every job runs"
            finish false
          }
          for name in $SAVING_JOBS; do
            re="^go-${name}-(Linux|Windows|macOS)-.*-${today}\$"
            printf '%s' "$caches" | jq -e --arg re "$re" '
              [.actions_caches[]
                | select(.ref == "refs/heads/main" and (.key | test($re)))]
              | length > 0' > /dev/null || {
              echo "::notice::no cache entry saved on main today ($today, UTC) for the $name job; every job runs and saves the caches"
              finish false
            }
          done

          echo "::notice::this commit already passed in manual run ${found% *} of ci.yaml; every other job is skipped"
          printf 'Every other job was skipped: this commit passed in manual run %s of ci.yaml: %s\n' "${found% *}" "${found#* }" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          finish true

  # Six parts of scripts/validate run as parallel jobs: static, the race
  # detector tests in three shards (test-1, test-2, test-3), the source
  # scans with the build contract (conformance) and the cache model
  # (cachemodel). The commit hook and make validate run static and then
  # tests, which runs the same go test calls in one process, so the hook and
  # CI share one definition. The static part includes the shell gate (syntax
  # and shellcheck over install.sh and scripts/*) and the check that the
  # three shards hold every race package and every internal/cli test once,
  # except the packages whose tests start shells (shellpkgs in
  # scripts/test), which no shard runs.
  lint:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: lint
      - uses: $/.github/actions/setup-tools
        with:
          shells: "false"
      - run: ./scripts/validate static
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  test-1:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Informational: prints the CPU model and count so that a timing change
      # from a different runner can be told apart from one the code caused.
      # Nothing gates on it, and a missing field or tool does not fail the step.
      - name: CPU model
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus: $(nproc || true)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test-1
      - uses: $/.github/actions/setup-tools
        with:
          lint-tools: "false"
          shells: "false"
      - run: ./scripts/validate tests-race-1
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  test-2:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Informational: prints the CPU model and count so that a timing change
      # from a different runner can be told apart from one the code caused.
      # Nothing gates on it, and a missing field or tool does not fail the step.
      - name: CPU model
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus: $(nproc || true)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test-2
          restore-from: test-1
      - uses: $/.github/actions/setup-tools
        with:
          lint-tools: "false"
          shells: "false"
      - run: ./scripts/validate tests-race-2

  test-3:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Informational: prints the CPU model and count so that a timing change
      # from a different runner can be told apart from one the code caused.
      # Nothing gates on it, and a missing field or tool does not fail the step.
      - name: CPU model
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus: $(nproc || true)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test-3
          restore-from: test-1
      - uses: $/.github/actions/setup-tools
        with:
          lint-tools: "false"
      # The completion script tests run each script under its real shell
      # (bash, zsh, fish, pwsh). With CI set a missing shell fails its
      # test, so this step asserts the other half: no test skipped, and
      # every one of the four shells used by at least one test. It prints
      # which shell binary each test used. It is also the package's race run:
      # the race shards leave the package out (shellpkgs in scripts/test).
      - name: Completion shell tests
        run: |
          log="${RUNNER_TEMP}/completions.log"
          if ! go test -race -count=1 -v ./internal/cli/completions/ > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          grep -E '^(--- |ok)' "$log"
          echo "shells used:"
          grep -ho 'shell [a-z]*: .*' "$log" | sort | uniq -c
          status=0
          for shell in bash zsh fish pwsh; do
            if ! grep -q "shell ${shell}: " "$log"; then
              echo "no completion test used ${shell}" >&2
              status=1
            fi
          done
          if grep -E '^\s*--- SKIP' "$log"; then
            echo "a completion shell test skipped" >&2
            status=1
          fi
          exit "$status"
      - run: ./scripts/validate tests-race-3

  conformance:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Informational: prints the CPU model and count so that a timing change
      # from a different runner can be told apart from one the code caused.
      # Nothing gates on it, and a missing field or tool does not fail the step.
      - name: CPU model
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus: $(nproc || true)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: conformance
      # The paste tests run each printed command under sh, bash, zsh,
      # fish and pwsh; with CI set a missing shell fails.
      - uses: $/.github/actions/setup-tools
        with:
          lint-tools: "false"
      - run: ./scripts/validate tests-conformance
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  cachemodel:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Informational: prints the CPU model and count so that a timing change
      # from a different runner can be told apart from one the code caused.
      # Nothing gates on it, and a missing field or tool does not fail the step.
      - name: CPU model
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus: $(nproc || true)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: cachemodel
          restore-from: e2e
      - run: ./scripts/validate tests-cachemodel

  # Compile-check every release platform so an arch-specific break (endian,
  # 32/64 assumptions) surfaces on the PR, not at tag time. The list must
  # match the build loop in scripts/release-build. linux/amd64 is kept for the 1:1
  # mapping with the release matrix, although the build contract in
  # conformance builds the same platform. One job per platform, so the
  # platforms build in parallel; each job restores the entry of the e2e job
  # through go-cache and saves none.
  cross-compile:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: s390x }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      # Informational: prints the CPU model and count so that a timing change
      # from a different runner can be told apart from one the code caused.
      # Nothing gates on it, and a missing field or tool does not fail the step.
      - name: CPU model
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus: $(nproc || true)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: cross-compile-${{ matrix.goos }}-${{ matrix.goarch }}
          restore-from: e2e
      - name: Compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  e2e:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Informational: prints the CPU model and count so that a timing change
      # from a different runner can be told apart from one the code caused.
      # Nothing gates on it, and a missing field or tool does not fail the step.
      - name: CPU model
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus: $(nproc || true)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: e2e
          setup-go-key: "true"
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: make e2e
        timeout-minutes: 20
      # The fault-check job and the linux/amd64 cross-compile job restore this
      # job's cache entry and build with CGO_ENABLED=0, which compiles net and
      # every package above it again. make e2e builds with cgo, so without this
      # step the entry holds none of those builds and both jobs compile them
      # from scratch.
      - name: Build without cgo for the jobs that read this cache
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.setup-go-cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.setup-go-key }}
  # Runs the tests the Windows jobs run, on Linux under strace, and fails
  # on every hardware fault (SIGSEGV, SIGBUS, SIGFPE) a test takes that has no
  # row in .github/fault-allowlist, including the faults Go recovers from. On
  # Windows the kernel writes the exception frame onto the stack of the
  # goroutine that took the fault, and on hosts with AMX the frame is larger
  # than the space the runtime keeps below a stack: a fault can corrupt
  # memory there. scripts/fault-trace is the go test -exec program that traces
  # each test binary and every program it starts; scripts/fault-check counts.
  # Its commands are the Windows jobs' commands with -race removed: the faults
  # a test takes do not depend on the race detector, which needs cgo and
  # installs signal handling of its own. A change to the tests a Windows job
  # runs is made here in the same commit.
  fault-check:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -exec=${{ github.workspace }}/scripts/fault-trace
      FAULT_LOG_DIR: /tmp/fault-logs
    steps:
      # Informational: prints the CPU model and count so that a timing change
      # from a different runner can be told apart from one the code caused.
      # Nothing gates on it, and a missing field or tool does not fail the step.
      - name: CPU model
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          echo "cpus: $(nproc || true)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: fault-check
          restore-from: e2e
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          strace -V | sed -n 1p
          mkdir -p "$FAULT_LOG_DIR"
      - run: go test -count=1 -run TestWindows ./install/
      - run: go test -count=1 ./internal/config/
      - run: go test -count=1 ./internal/telemetry/ ./internal/telemetrysend/ ./internal/fsacl/ ./internal/commands/telemetrycmd/
      - run: go test -count=1 -v ./internal/testfs/
      - run: go test -count=1 -run 'TestRecordingAddsTheListedOperationsToThePluginHit|TestARecordedRunReadsTheFactsFileOnce|TestTheFirstLoginReadsAndWritesTheFactsFileAndNothingElse|TestTheFileOperationsOfAPluginSignInAreTheListed|TestTheFileOperationsOfAFirstPluginRunAreTheListed|TestTelemetryOffAlwaysWinsOverUpload|TestDevBuildsHonorExperiments|TestExecPluginRunsNeverUpload|TestReleaseBuildsIgnoreExperiments|TestNoUploadWithoutAnEndpoint|TestUploadURLRules|TestPassFileOfThisRunIsSent|TestPassRemovesAnOldHourWhenItsWriteOutlastsTheReadLimit|TestUploadStaysInTheDeadline|TestUploadNeverChangesTheRun|TestUploadSendsNoCredential|TestDebugLinesShowOnlyCountsOriginAndAnswer|TestARecordedRunWithTheExperimentReadsTheStateOnce|TestUploadExcludedNamesRegisteredCommands|TestTheControlsFunctionTakesNoLock|TestUploadCommandRefusals|TestUploadCommandIgnoresTheHourlyLimit|TestUploadCommandSendsTheCurrentHour|TestUploadCommandWithNoConfigDirectory|TestUploadCommandSharesTheLock|TestUploadCommandIsBounded|TestUploadCommandOutput|TestDebugLinesOfTheUploadCommand|TestUploadCommandRecordsNothing|TestUploadCommandSendsNoCredential|TestUploadCommandTakesNoConfigLock|TestUploadCommandReportsFailures|TestUploadCommandUnderReadOnly|TestUploadCommandBoundIsTheTelemetryBound|TestLinesWithNoChosenCommandRecordNothing|TestNoConfigDirectoryRecordsNothingAndCreatesNone|TestTelemetryExcludedHasExactlyTheSevenCommands|TestEveryRegisteredCommandRecordsOrIsExcluded|TestSubcommandCompletionTelemetryGroup|TestHelpGolden|TestParseGolden|TestTheConfigHelpRowNamesTheVariableTheSameWayOnEveryOS' ./internal/cli/
      - run: go test -run '^$' -bench 'BenchmarkPluginHit$' -benchtime 200x -count 10 ./internal/cli/
      - run: go test -count=1 -v -run 'TestRenameOverAnOpenTarget|TestRemoveOfAnOpenFile|TestReadsRetryASharingViolation|TestShareRetryLeavesOtherErrorsAlone|TestConcurrentWritersOfOneFile|TestReadsDuringReplace|TestRootReadsDuringRootReplace' ./internal/config/
      - run: go test -count=1 -run 'TestOneRelativeSpelling|TestOneDirectoryReachedBy|TestCopiedDirectory|TestHotPathOperationCounts|TestACrashBetweenTheTwoHalves|TestEveryExecPluginRemedyIsWrittenForTheInvocation|TestLookupStoredLoginOutcomes|TestNoTerminalLoginNamesTheEntryTheKubeconfigIdentifies|TestGetTokenStoreConflictNamesTheRegenerateSteps|TestTheExecPluginNamesTheRemediesWithoutATerminal' ./internal/token/
      - run: go test -count=1 -run 'TestExecCommand|TestKubeconfigRecords|TestKubeconfigNotices|TestKubeconfigInstallHint|TestKubeconfigLookup|TestKubeconfigReuses|TestKubeconfigEntryName' ./internal/engine/kubeconfig/
      - run: go test -count=1 -run '^Test(WatchObject|ListObject|WaitObject)' ./internal/client/provider/
      - run: go test -count=1 -v -run 'Test(ExactValuePaste|StdinPipe)(Pwsh|PowerShell51)$' ./test/conformance/
      - run: bash scripts/e2e
      - run: go test -count=1 -v -run TestPwsh ./internal/cli/completions/
      - name: Fault check
        if: ${{ !cancelled() }}
        run: ./scripts/fault-check

  install-windows-install:
    # The installer's behavior and security tests (token handling,
    # checksums, the atomic junction switch) only execute on Windows -
    # everywhere else they skip, so without this job they would never
    # run in CI.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Informational: names the host and nothing gates on it. Prints the model
      # name and the number of logical processors of each processor socket. A
      # query error is not shown and does not fail the step, so a runner
      # without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Format-List Name, NumberOfLogicalProcessors
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: install-windows-install
          restore-from: install-windows-cli
      # Only the Windows suite: the package's POSIX-sh installer tests
      # assume sh/symlink semantics and fail on a Windows runner. -race
      # per the repo's testing mandate (the runner ships gcc).
      - run: go test -race -count=1 -run TestWindows ./install/

  install-windows-config:
    # The two ./internal/config/ steps share this job: the second reuses
    # the build of the first.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Informational: names the host and nothing gates on it. Prints the model
      # name and the number of logical processors of each processor socket. A
      # query error is not shown and does not fail the step, so a runner
      # without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Format-List Name, NumberOfLogicalProcessors
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: install-windows-config
      # Three things this leg is for. The path-identity tests for Windows
      # spellings - volume and separator forms of one directory,
      # %APPDATA% compared in another casing - are build-tagged for
      # windows and run nowhere else. The credential store's identity
      # tests do run everywhere, but have only ever run on Unix, and
      # their subject is a directory opened without following symlinks:
      # the cases that need symlinks or real permission bits skip here
      # (an unprivileged runner cannot create either), so what this leg
      # adds for them is the rest of the file behavior on NTFS. The cache
      # binding stamp is the third: it is written by atomic rename on
      # every config write that can invalidate a cache record, and the
      # write replaces a path that is not a regular file rather than
      # failing on it - rename semantics differ enough on NTFS that the
      # rename, the replacement and the stamp-before-config ordering all
      # want running here. Path canonicalization is the fourth, and runs
      # from internal/token where its tests live: a record is bound to
      # the absolute, cleaned directory that wrote it, and Windows
      # resolves that through a different call than Unix does, so the
      # relative spellings and the separator forms these tests compare
      # are resolved by code that never runs on the other leg. Case
      # folding is not covered on either: two spellings of one directory
      # differing only in case are two directories to a record, which is
      # a miss and not a wrong hit.
      - run: go test -race -count=1 ./internal/config/
      # The usage event store and the file access list code: the access
      # list a new telemetry file inherits, the rename and removal rules
      # NTFS applies to files other handles hold open, and the committed
      # contract files read from a Windows checkout. The telemetry commands
      # list and delete that store, so their tests run here too.
      - run: go test -race -count=1 ./internal/telemetry/ ./internal/telemetrysend/ ./internal/fsacl/ ./internal/commands/telemetrycmd/
      # The test helpers for the Windows differences: -v prints each test and
      # the log shows which Windows branches of the helpers ran and which
      # skipped.
      - run: go test -race -count=1 -v ./internal/testfs/
      # The rename, removal and read retry tests log what Windows
      # returns: errors by errno with the retry off, and what plain reads
      # hit while a file is replaced. -v prints those lines when the
      # tests pass.
      - run: go test -race -count=1 -v -run 'TestRenameOverAnOpenTarget|TestRemoveOfAnOpenFile|TestReadsRetryASharingViolation|TestShareRetryLeavesOtherErrorsAlone|TestConcurrentWritersOfOneFile|TestReadsDuringReplace|TestRootReadsDuringRootReplace' ./internal/config/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  install-windows-cli:
    # The two ./internal/cli/ steps share this job: they reuse one Go
    # build cache.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Informational: names the host and nothing gates on it. Prints the model
      # name and the number of logical processors of each processor socket. A
      # query error is not shown and does not fail the step, so a runner
      # without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Format-List Name, NumberOfLogicalProcessors
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: install-windows-cli
      # What one recorded command run costs the exec plugin's cache hit,
      # through the built command tree: the directory stat and the store's
      # file operations, on NTFS, on top of the hit's own reads, and no
      # config load added. And what the server facts refresh adds to a
      # run that got an answer: nothing when no record is due, else the
      # open of the telemetry directory and one temporary file renamed over
      # the facts file. And the first auth login on a fresh install, which
      # runs a whole login through the built tree with the file credential
      # store: the read of the facts file and the write that creates the
      # telemetry directory and the file, and no event. The exec plugin's
      # sign-in with the directory present adds the sign-in's own read of
      # the facts file before the event and the refresh's write after it;
      # the plugin's first run, which creates the directory during the run,
      # reads the facts file once and writes the file that creates
      # telemetry, with no event. The same step runs TestHelpGolden and
      # TestParseGolden, which compare every help page with its golden file,
      # and TestTheConfigHelpRowNamesTheVariableTheSameWayOnEveryOS, which
      # asserts that the --config row reads [$RANCHER_CLI_CONFIG_DIR] in every
      # shell on Windows.
      - run: go test -race -count=1 -run 'TestRecordingAddsTheListedOperationsToThePluginHit|TestARecordedRunReadsTheFactsFileOnce|TestTheFirstLoginReadsAndWritesTheFactsFileAndNothingElse|TestTheFileOperationsOfAPluginSignInAreTheListed|TestTheFileOperationsOfAFirstPluginRunAreTheListed|TestTelemetryOffAlwaysWinsOverUpload|TestDevBuildsHonorExperiments|TestExecPluginRunsNeverUpload|TestReleaseBuildsIgnoreExperiments|TestNoUploadWithoutAnEndpoint|TestUploadURLRules|TestPassFileOfThisRunIsSent|TestPassRemovesAnOldHourWhenItsWriteOutlastsTheReadLimit|TestUploadStaysInTheDeadline|TestUploadNeverChangesTheRun|TestUploadSendsNoCredential|TestDebugLinesShowOnlyCountsOriginAndAnswer|TestARecordedRunWithTheExperimentReadsTheStateOnce|TestUploadExcludedNamesRegisteredCommands|TestTheControlsFunctionTakesNoLock|TestUploadCommandRefusals|TestUploadCommandIgnoresTheHourlyLimit|TestUploadCommandSendsTheCurrentHour|TestUploadCommandWithNoConfigDirectory|TestUploadCommandSharesTheLock|TestUploadCommandIsBounded|TestUploadCommandOutput|TestDebugLinesOfTheUploadCommand|TestUploadCommandRecordsNothing|TestUploadCommandSendsNoCredential|TestUploadCommandTakesNoConfigLock|TestUploadCommandReportsFailures|TestUploadCommandUnderReadOnly|TestUploadCommandBoundIsTheTelemetryBound|TestLinesWithNoChosenCommandRecordNothing|TestNoConfigDirectoryRecordsNothingAndCreatesNone|TestTelemetryExcludedHasExactlyTheSevenCommands|TestEveryRegisteredCommandRecordsOrIsExcluded|TestSubcommandCompletionTelemetryGroup|TestHelpGolden|TestParseGolden|TestTheConfigHelpRowNamesTheVariableTheSameWayOnEveryOS' ./internal/cli/
      # The same hit timed with recording on and off, ten runs of each, for
      # the median. No -race: the detector would hide the difference.
      - run: go test -run '^$' -bench 'BenchmarkPluginHit$' -benchtime 200x -count 10 ./internal/cli/
      # The exec plugin's remedies carry a shell-quoted Windows path, and
      # the lookup and the no-terminal login run on it too.
      - run: go test -race -count=1 -run 'TestOneRelativeSpelling|TestOneDirectoryReachedBy|TestCopiedDirectory|TestHotPathOperationCounts|TestACrashBetweenTheTwoHalves|TestEveryExecPluginRemedyIsWrittenForTheInvocation|TestLookupStoredLoginOutcomes|TestNoTerminalLoginNamesTheEntryTheKubeconfigIdentifies|TestGetTokenStoreConflictNamesTheRegenerateSteps|TestTheExecPluginNamesTheRemediesWithoutATerminal' ./internal/token/
      # What the kubeconfig records resolves through Windows' own path
      # calls: the directory as spelled, volumes, both separators and ~\ in
      # --exec-command, and the remedies naming a quoted Windows path.
      - run: go test -race -count=1 -run 'TestExecCommand|TestKubeconfigRecords|TestKubeconfigNotices|TestKubeconfigInstallHint|TestKubeconfigLookup|TestKubeconfigReuses|TestKubeconfigEntryName' ./internal/engine/kubeconfig/
      - run: go test -race -count=1 -run '^Test(WatchObject|ListObject|WaitObject)' ./internal/client/provider/
      # The printed commands, pasted into pwsh and Windows PowerShell 5.1
      # from a .ps1 file, and the bytes those shells send on stdin through a
      # pipe.
      - run: go test -count=1 -v -run 'Test(ExactValuePaste|StdinPipe)(Pwsh|PowerShell51)$' ./test/conformance/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  e2e-windows:
    # The same suite as the e2e job, on the platform whose exec, path,
    # and credential-store semantics differ: the harness resolves
    # rancher.exe, pathmatch compares native separators, and scenario
    # skips gate what cannot occur here. Without this leg the suite's
    # Windows support can only regress silently between Windows runs.
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Informational: names the host and nothing gates on it. Prints the model
      # name and the number of logical processors of each processor socket. A
      # query error is not shown and does not fail the step, so a runner
      # without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Format-List Name, NumberOfLogicalProcessors
      # Before checkout: the e2e goldens and txtar fixtures are
      # byte-compared, so a CRLF working tree fails them by
      # construction.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: e2e-windows
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: bash scripts/e2e
        timeout-minutes: 25
      # The pwsh completion script runs under the runner's own PowerShell.
      # No -race: the tests build cmd/rancher themselves, and without it the
      # compile reuses the Go build cache the e2e step above filled.
      - run: go test -count=1 -v -run TestPwsh ./internal/cli/completions/
        timeout-minutes: 10
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}
