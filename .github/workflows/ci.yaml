name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The two parts of scripts/validate run as parallel jobs; the commit hook
  # and make validate run the same two parts in one process, so the hook and
  # CI share one definition. The static part includes the shell gate (syntax
  # and shellcheck over install.sh and scripts/*).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-tools
        with:
          shells: "false"
      - run: ./scripts/validate static

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-tools
        with:
          lint-tools: "false"
      # The completion script tests run each script under its real shell
      # (bash, zsh, fish, pwsh). With CI set a missing shell fails its
      # test, so this step asserts the other half: no test skipped, and
      # every one of the four shells used by at least one test. It prints
      # which shell binary each test used.
      - name: Completion shell tests
        run: |
          log="${RUNNER_TEMP}/completions.log"
          if ! go test -count=1 -v ./internal/cli/completions/ > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          grep -E '^(--- |ok)' "$log"
          echo "shells used:"
          grep -ho 'shell [a-z]*: .*' "$log" | sort | uniq -c
          status=0
          for shell in bash zsh fish pwsh; do
            if ! grep -q "shell ${shell}: " "$log"; then
              echo "no completion test used ${shell}" >&2
              status=1
            fi
          done
          if grep -E '^\s*--- SKIP' "$log"; then
            echo "a completion shell test skipped" >&2
            status=1
          fi
          exit "$status"
      - run: ./scripts/validate tests

  # Compile-check every release platform so an arch-specific break (endian,
  # 32/64 assumptions) surfaces on the PR, not at tag time. The list must
  # match the build loop in release.yaml. linux/amd64 duplicates the test
  # job's native build; it is kept for the 1:1 mapping with the release
  # matrix. One job per platform, each with its own build cache, so the
  # platforms build in parallel and reuse their own compiled packages:
  # setup-go's cache key is shared by every Linux job and is saved by
  # whichever job finishes first, so it cannot hold six platforms' builds.
  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: s390x }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go build and modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: cross-compile-${{ matrix.goos }}-${{ matrix.goarch }}-go${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            cross-compile-${{ matrix.goos }}-${{ matrix.goarch }}-go${{ steps.setup-go.outputs.go-version }}-
      - name: Compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: make e2e
        timeout-minutes: 20
  install-windows:
    # The installer's behavior and security tests (token handling,
    # checksums, the atomic junction switch) only execute on Windows -
    # everywhere else they skip, so without this job they would never
    # run in CI.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Only the Windows suite: the package's POSIX-sh installer tests
      # assume sh/symlink semantics and fail on a Windows runner. -race
      # per the repo's testing mandate (the runner ships gcc).
      - run: go test -race -count=1 -run TestWindows ./install/
      # Three things this leg is for. The path-identity tests for Windows
      # spellings - volume and separator forms of one directory,
      # %APPDATA% compared in another casing - are build-tagged for
      # windows and run nowhere else. The credential store's identity
      # tests do run everywhere, but have only ever run on Unix, and
      # their subject is a directory opened without following symlinks:
      # the cases that need symlinks or real permission bits skip here
      # (an unprivileged runner cannot create either), so what this leg
      # adds for them is the rest of the file behavior on NTFS. The cache
      # binding stamp is the third: it is written by atomic rename on
      # every config write that can invalidate a cache record, and the
      # write replaces a path that is not a regular file rather than
      # failing on it - rename semantics differ enough on NTFS that the
      # rename, the replacement and the stamp-before-config ordering all
      # want running here. Path canonicalization is the fourth, and runs
      # from internal/token where its tests live: a record is bound to
      # the absolute, cleaned directory that wrote it, and Windows
      # resolves that through a different call than Unix does, so the
      # relative spellings and the separator forms these tests compare
      # are resolved by code that never runs on the other leg. Case
      # folding is not covered on either: two spellings of one directory
      # differing only in case are two directories to a record, which is
      # a miss and not a wrong hit.
      - run: go test -race -count=1 ./internal/config/
      # The rename, removal and read retry tests log what Windows
      # returns: errors by errno with the retry off, and what plain reads
      # hit while a file is replaced. -v prints those lines when the
      # tests pass.
      - run: go test -race -count=1 -v -run 'TestRenameOverAnOpenTarget|TestRemoveOfAnOpenFile|TestReadsRetryASharingViolation|TestShareRetryLeavesOtherErrorsAlone|TestConcurrentWritersOfOneFile|TestReadsDuringReplace|TestRootReadsDuringRootReplace' ./internal/config/
      # The exec plugin's remedies carry a shell-quoted Windows path, and
      # the lookup and the no-terminal login run on it too.
      - run: go test -race -count=1 -run 'TestOneRelativeSpelling|TestOneDirectoryReachedBy|TestCopiedDirectory|TestHotPathOperationCounts|TestACrashBetweenTheTwoHalves|TestEveryExecPluginRemedyIsWrittenForTheInvocation|TestLookupStoredLoginOutcomes|TestNoTerminalLoginNamesTheEntryTheKubeconfigIdentifies|TestGetTokenStoreConflictNamesTheRegenerateSteps|TestTheExecPluginNamesTheRemediesWithoutATerminal' ./internal/token/
      # What the kubeconfig records resolves through Windows' own path
      # calls: the directory as spelled, volumes, both separators and ~\ in
      # --exec-command, and the remedies naming a quoted Windows path.
      - run: go test -race -count=1 -run 'TestExecCommand|TestKubeconfigRecords|TestKubeconfigNotices|TestKubeconfigInstallHint|TestKubeconfigLookup|TestKubeconfigReuses|TestKubeconfigEntryName' ./internal/engine/kubeconfig/

  e2e-windows:
    # The same suite as the e2e job, on the platform whose exec, path,
    # and credential-store semantics differ: the harness resolves
    # rancher.exe, pathmatch compares native separators, and scenario
    # skips gate what cannot occur here. Without this leg the suite's
    # Windows support can only regress silently between Windows runs.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Before checkout: the e2e goldens and txtar fixtures are
      # byte-compared, so a CRLF working tree fails them by
      # construction.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: bash scripts/e2e
        timeout-minutes: 25
      # The pwsh completion script runs under the runner's own PowerShell.
      # No -race: the tests build cmd/rancher themselves, and without it the
      # compile reuses the Go build cache the e2e step above filled.
      - run: go test -count=1 -v -run TestPwsh ./internal/cli/completions/
        timeout-minutes: 10
