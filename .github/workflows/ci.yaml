name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push run gets a group of its own commit. With a group of the ref, a
# third push to main would cancel the push run still waiting, and that run
# would never finish or save its caches. Other runs share the group of their
# ref: a dispatch waits its turn behind the run in progress on its branch, and
# a new pull request run cancels the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ci-windows.yaml carries copies of the two Windows jobs below
# (install-windows and e2e-windows) for a run of just those two. Its job
# names differ from the check names this workflow reports. A run of it
# never replaces a full run of this workflow: a merge requires the full run.
# A change to a Windows job here is made in the copy in the same commit.
jobs:
  # The three parts of scripts/validate run as parallel jobs; the commit
  # hook and make validate run static and then tests, which runs both test
  # parts in one process, so the hook and CI share one definition. The
  # static part includes the shell gate (syntax and shellcheck over
  # install.sh and scripts/*).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: lint
      - uses: $/.github/actions/setup-tools
        with:
          shells: "false"
      - run: ./scripts/validate static
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test
      - uses: $/.github/actions/setup-tools
        with:
          lint-tools: "false"
      # The completion script tests run each script under its real shell
      # (bash, zsh, fish, pwsh). With CI set a missing shell fails its
      # test, so this step asserts the other half: no test skipped, and
      # every one of the four shells used by at least one test. It prints
      # which shell binary each test used.
      - name: Completion shell tests
        run: |
          log="${RUNNER_TEMP}/completions.log"
          if ! go test -count=1 -v ./internal/cli/completions/ > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          grep -E '^(--- |ok)' "$log"
          echo "shells used:"
          grep -ho 'shell [a-z]*: .*' "$log" | sort | uniq -c
          status=0
          for shell in bash zsh fish pwsh; do
            if ! grep -q "shell ${shell}: " "$log"; then
              echo "no completion test used ${shell}" >&2
              status=1
            fi
          done
          if grep -E '^\s*--- SKIP' "$log"; then
            echo "a completion shell test skipped" >&2
            status=1
          fi
          exit "$status"
      - run: ./scripts/validate tests-race
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  test-norace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test-norace
      - run: ./scripts/validate tests-norace
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  # Compile-check every release platform so an arch-specific break (endian,
  # 32/64 assumptions) surfaces on the PR, not at tag time. The list must
  # match the build loop in release.yaml. linux/amd64 is kept for the 1:1
  # mapping with the release matrix, although the build contract in
  # test-norace builds the same platform. One job per platform, so the
  # platforms build in parallel; each job, like every other job that uses
  # Go, has its own cache entry through go-cache.
  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: s390x }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: cross-compile-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: Compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: e2e
          setup-go-key: "true"
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: make e2e
        timeout-minutes: 20
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.setup-go-cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.setup-go-key }}
  # Runs the tests the two Windows jobs run, on Linux under strace, and fails
  # on every hardware fault (SIGSEGV, SIGBUS, SIGFPE) a test takes that has no
  # row in .github/fault-allowlist, including the faults Go recovers from. On
  # Windows the kernel writes the exception frame onto the stack of the
  # goroutine that took the fault, and on hosts with AMX the frame is larger
  # than the space the runtime keeps below a stack: a fault can corrupt
  # memory there. scripts/fault-trace is the go test -exec program that traces
  # each test binary and every program it starts; scripts/fault-check counts.
  # Its commands are the Windows jobs' commands with -race removed: the faults
  # a test takes do not depend on the race detector, which needs cgo and
  # installs signal handling of its own. A change to the tests a Windows job
  # runs is made here in the same commit.
  fault-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -exec=${{ github.workspace }}/scripts/fault-trace
      FAULT_LOG_DIR: /tmp/fault-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: fault-check
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          strace -V | sed -n 1p
          mkdir -p "$FAULT_LOG_DIR"
      - run: go test -count=1 -run TestWindows ./install/
      - run: go test -count=1 ./internal/config/
      - run: go test -count=1 ./internal/telemetry/ ./internal/telemetrysend/ ./internal/fsacl/ ./internal/commands/telemetrycmd/
      - run: go test -count=1 -v ./internal/testfs/
      - run: go test -count=1 -run 'TestRecordingAddsTheListedOperationsToThePluginHit|TestARecordedRunReadsTheFactsFileOnce|TestTheFirstLoginReadsAndWritesTheFactsFileAndNothingElse|TestTheFileOperationsOfAPluginSignInAreTheListed|TestTheFileOperationsOfAFirstPluginRunAreTheListed|TestTelemetryOffAlwaysWinsOverUpload|TestDevBuildsHonorExperiments|TestExecPluginRunsNeverUpload|TestReleaseBuildsIgnoreExperiments|TestNoUploadWithoutAnEndpoint|TestUploadURLRules|TestPassFileOfThisRunIsSent|TestPassRemovesAnOldHourWhenItsWriteOutlastsTheReadLimit|TestUploadStaysInTheDeadline|TestUploadNeverChangesTheRun|TestUploadSendsNoCredential|TestDebugLinesShowOnlyCountsOriginAndAnswer|TestARecordedRunWithTheExperimentReadsTheStateOnce|TestUploadExcludedNamesRegisteredCommands|TestTheControlsFunctionTakesNoLock|TestUploadCommandRefusals|TestUploadCommandIgnoresTheHourlyLimit|TestUploadCommandSendsTheCurrentHour|TestUploadCommandWithNoConfigDirectory|TestUploadCommandSharesTheLock|TestUploadCommandIsBounded|TestUploadCommandOutput|TestDebugLinesOfTheUploadCommand|TestUploadCommandRecordsNothing|TestUploadCommandSendsNoCredential|TestUploadCommandTakesNoConfigLock|TestUploadCommandReportsFailures|TestUploadCommandUnderReadOnly|TestUploadCommandBoundIsTheTelemetryBound|TestLinesWithNoChosenCommandRecordNothing|TestNoConfigDirectoryRecordsNothingAndCreatesNone|TestTelemetryExcludedHasExactlyTheSevenCommands|TestEveryRegisteredCommandRecordsOrIsExcluded|TestSubcommandCompletionTelemetryGroup' ./internal/cli/
      - run: go test -run '^$' -bench 'BenchmarkPluginHit$' -benchtime 200x -count 10 ./internal/cli/
      - run: go test -count=1 -v -run 'TestRenameOverAnOpenTarget|TestRemoveOfAnOpenFile|TestReadsRetryASharingViolation|TestShareRetryLeavesOtherErrorsAlone|TestConcurrentWritersOfOneFile|TestReadsDuringReplace|TestRootReadsDuringRootReplace' ./internal/config/
      - run: go test -count=1 -run 'TestOneRelativeSpelling|TestOneDirectoryReachedBy|TestCopiedDirectory|TestHotPathOperationCounts|TestACrashBetweenTheTwoHalves|TestEveryExecPluginRemedyIsWrittenForTheInvocation|TestLookupStoredLoginOutcomes|TestNoTerminalLoginNamesTheEntryTheKubeconfigIdentifies|TestGetTokenStoreConflictNamesTheRegenerateSteps|TestTheExecPluginNamesTheRemediesWithoutATerminal' ./internal/token/
      - run: go test -count=1 -run 'TestExecCommand|TestKubeconfigRecords|TestKubeconfigNotices|TestKubeconfigInstallHint|TestKubeconfigLookup|TestKubeconfigReuses|TestKubeconfigEntryName' ./internal/engine/kubeconfig/
      - run: bash scripts/e2e
      - run: go test -count=1 -v -run TestPwsh ./internal/cli/completions/
      - name: Fault check
        if: ${{ !cancelled() }}
        run: ./scripts/fault-check
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}
  install-windows:
    # The installer's behavior and security tests (token handling,
    # checksums, the atomic junction switch) only execute on Windows -
    # everywhere else they skip, so without this job they would never
    # run in CI.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      # Informational: names the host and nothing gates on it. Prints one line
      # per processor. A query error is not shown and does not fail the step,
      # so a runner without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: install-windows
      # Only the Windows suite: the package's POSIX-sh installer tests
      # assume sh/symlink semantics and fail on a Windows runner. -race
      # per the repo's testing mandate (the runner ships gcc).
      - run: go test -race -count=1 -run TestWindows ./install/
      # Three things this leg is for. The path-identity tests for Windows
      # spellings - volume and separator forms of one directory,
      # %APPDATA% compared in another casing - are build-tagged for
      # windows and run nowhere else. The credential store's identity
      # tests do run everywhere, but have only ever run on Unix, and
      # their subject is a directory opened without following symlinks:
      # the cases that need symlinks or real permission bits skip here
      # (an unprivileged runner cannot create either), so what this leg
      # adds for them is the rest of the file behavior on NTFS. The cache
      # binding stamp is the third: it is written by atomic rename on
      # every config write that can invalidate a cache record, and the
      # write replaces a path that is not a regular file rather than
      # failing on it - rename semantics differ enough on NTFS that the
      # rename, the replacement and the stamp-before-config ordering all
      # want running here. Path canonicalization is the fourth, and runs
      # from internal/token where its tests live: a record is bound to
      # the absolute, cleaned directory that wrote it, and Windows
      # resolves that through a different call than Unix does, so the
      # relative spellings and the separator forms these tests compare
      # are resolved by code that never runs on the other leg. Case
      # folding is not covered on either: two spellings of one directory
      # differing only in case are two directories to a record, which is
      # a miss and not a wrong hit.
      - run: go test -race -count=1 ./internal/config/
      # The usage event store and the file access list code: the access
      # list a new telemetry file inherits, the rename and removal rules
      # NTFS applies to files other handles hold open, and the committed
      # contract files read from a Windows checkout. The telemetry commands
      # list and delete that store, so their tests run here too.
      - run: go test -race -count=1 ./internal/telemetry/ ./internal/telemetrysend/ ./internal/fsacl/ ./internal/commands/telemetrycmd/
      # The test helpers for the Windows differences: -v prints each test and
      # the log shows which Windows branches of the helpers ran and which
      # skipped.
      - run: go test -race -count=1 -v ./internal/testfs/
      # What one recorded command run costs the exec plugin's cache hit,
      # through the built command tree: the directory stat and the store's
      # file operations, on NTFS, on top of the hit's own reads, and no
      # config load added. And what the server facts refresh adds to a
      # run that got an answer: nothing when no record is due, else the
      # open of the telemetry directory and one temporary file renamed over
      # the facts file. And the first auth login on a fresh install, which
      # runs a whole login through the built tree with the file credential
      # store: the read of the facts file and the write that creates the
      # telemetry directory and the file, and no event. The exec plugin's
      # sign-in with the directory present adds the sign-in's own read of
      # the facts file before the event and the refresh's write after it;
      # the plugin's first run, which creates the directory during the run,
      # reads the facts file once and writes the file that creates
      # telemetry, with no event.
      - run: go test -race -count=1 -run 'TestRecordingAddsTheListedOperationsToThePluginHit|TestARecordedRunReadsTheFactsFileOnce|TestTheFirstLoginReadsAndWritesTheFactsFileAndNothingElse|TestTheFileOperationsOfAPluginSignInAreTheListed|TestTheFileOperationsOfAFirstPluginRunAreTheListed|TestTelemetryOffAlwaysWinsOverUpload|TestDevBuildsHonorExperiments|TestExecPluginRunsNeverUpload|TestReleaseBuildsIgnoreExperiments|TestNoUploadWithoutAnEndpoint|TestUploadURLRules|TestPassFileOfThisRunIsSent|TestPassRemovesAnOldHourWhenItsWriteOutlastsTheReadLimit|TestUploadStaysInTheDeadline|TestUploadNeverChangesTheRun|TestUploadSendsNoCredential|TestDebugLinesShowOnlyCountsOriginAndAnswer|TestARecordedRunWithTheExperimentReadsTheStateOnce|TestUploadExcludedNamesRegisteredCommands|TestTheControlsFunctionTakesNoLock|TestUploadCommandRefusals|TestUploadCommandIgnoresTheHourlyLimit|TestUploadCommandSendsTheCurrentHour|TestUploadCommandWithNoConfigDirectory|TestUploadCommandSharesTheLock|TestUploadCommandIsBounded|TestUploadCommandOutput|TestDebugLinesOfTheUploadCommand|TestUploadCommandRecordsNothing|TestUploadCommandSendsNoCredential|TestUploadCommandTakesNoConfigLock|TestUploadCommandReportsFailures|TestUploadCommandUnderReadOnly|TestUploadCommandBoundIsTheTelemetryBound|TestLinesWithNoChosenCommandRecordNothing|TestNoConfigDirectoryRecordsNothingAndCreatesNone|TestTelemetryExcludedHasExactlyTheSevenCommands|TestEveryRegisteredCommandRecordsOrIsExcluded|TestSubcommandCompletionTelemetryGroup' ./internal/cli/
      # The same hit timed with recording on and off, ten runs of each, for
      # the median. No -race: the detector would hide the difference.
      - run: go test -run '^$' -bench 'BenchmarkPluginHit$' -benchtime 200x -count 10 ./internal/cli/
      # The rename, removal and read retry tests log what Windows
      # returns: errors by errno with the retry off, and what plain reads
      # hit while a file is replaced. -v prints those lines when the
      # tests pass.
      - run: go test -race -count=1 -v -run 'TestRenameOverAnOpenTarget|TestRemoveOfAnOpenFile|TestReadsRetryASharingViolation|TestShareRetryLeavesOtherErrorsAlone|TestConcurrentWritersOfOneFile|TestReadsDuringReplace|TestRootReadsDuringRootReplace' ./internal/config/
      # The exec plugin's remedies carry a shell-quoted Windows path, and
      # the lookup and the no-terminal login run on it too.
      - run: go test -race -count=1 -run 'TestOneRelativeSpelling|TestOneDirectoryReachedBy|TestCopiedDirectory|TestHotPathOperationCounts|TestACrashBetweenTheTwoHalves|TestEveryExecPluginRemedyIsWrittenForTheInvocation|TestLookupStoredLoginOutcomes|TestNoTerminalLoginNamesTheEntryTheKubeconfigIdentifies|TestGetTokenStoreConflictNamesTheRegenerateSteps|TestTheExecPluginNamesTheRemediesWithoutATerminal' ./internal/token/
      # What the kubeconfig records resolves through Windows' own path
      # calls: the directory as spelled, volumes, both separators and ~\ in
      # --exec-command, and the remedies naming a quoted Windows path.
      - run: go test -race -count=1 -run 'TestExecCommand|TestKubeconfigRecords|TestKubeconfigNotices|TestKubeconfigInstallHint|TestKubeconfigLookup|TestKubeconfigReuses|TestKubeconfigEntryName' ./internal/engine/kubeconfig/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}

  e2e-windows:
    # The same suite as the e2e job, on the platform whose exec, path,
    # and credential-store semantics differ: the harness resolves
    # rancher.exe, pathmatch compares native separators, and scenario
    # skips gate what cannot occur here. Without this leg the suite's
    # Windows support can only regress silently between Windows runs.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Informational: names the host and nothing gates on it. Prints one line
      # per processor. A query error is not shown and does not fail the step,
      # so a runner without WMI access prints nothing.
      - name: CPU model
        shell: pwsh
        run: Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
      # Before checkout: the e2e goldens and txtar fixtures are
      # byte-compared, so a CRLF working tree fails them by
      # construction.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: e2e-windows
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: bash scripts/e2e
        timeout-minutes: 25
      # The pwsh completion script runs under the runner's own PowerShell.
      # No -race: the tests build cmd/rancher themselves, and without it the
      # compile reuses the Go build cache the e2e step above filled.
      - run: go test -count=1 -v -run TestPwsh ./internal/cli/completions/
        timeout-minutes: 10
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.path }}
          key: ${{ steps.go-cache.outputs.key }}
