name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-tools
      # The shell gate (syntax + shellcheck over install.sh and scripts/*)
      # lives inside make validate, so the hook and CI share one definition.
      - run: make validate

  # Compile-check every release platform so an arch-specific break (endian,
  # 32/64 assumptions) surfaces on the PR, not at tag time. The list must
  # match the build loop in release.yaml. linux/amd64 duplicates the validate
  # job's native build; it is kept for the 1:1 mapping with the release
  # matrix. One job, one loop: a matrix would pay checkout+setup per leg for
  # no isolation benefit.
  cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compile all release platforms
        run: |
          for platform in linux/amd64 linux/arm64 linux/s390x darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> ${platform}"
            GOOS="${platform%/*}" GOARCH="${platform#*/}" CGO_ENABLED=0 go build ./...
          done

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: make e2e
        timeout-minutes: 20
  install-windows:
    # The installer's behavior and security tests (token handling,
    # checksums, the atomic junction switch) only execute on Windows -
    # everywhere else they skip, so without this job they would never
    # run in CI.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Only the Windows suite: the package's POSIX-sh installer tests
      # assume sh/symlink semantics and fail on a Windows runner. -race
      # per the repo's testing mandate (the runner ships gcc).
      - run: go test -race -count=1 -run TestWindows ./install/
      # Three things this leg is for. The path-identity tests for Windows
      # spellings - volume and separator forms of one directory,
      # %APPDATA% compared in another casing - are build-tagged for
      # windows and run nowhere else. The credential store's identity
      # tests do run everywhere, but have only ever run on Unix, and
      # their subject is a directory opened without following symlinks:
      # the cases that need symlinks or real permission bits skip here
      # (an unprivileged runner cannot create either), so what this leg
      # adds for them is the rest of the file behavior on NTFS. The cache
      # binding stamp is the third: it is written by atomic rename on
      # every config write that can invalidate a cache record, and the
      # write replaces a path that is not a regular file rather than
      # failing on it - rename semantics differ enough on NTFS that the
      # rename, the replacement and the stamp-before-config ordering all
      # want running here. Path canonicalization is the fourth, and runs
      # from internal/token where its tests live: a record is bound to
      # the absolute, cleaned directory that wrote it, and Windows
      # resolves that through a different call than Unix does, so the
      # relative spellings and the separator forms these tests compare
      # are resolved by code that never runs on the other leg. Case
      # folding is not covered on either: two spellings of one directory
      # differing only in case are two directories to a record, which is
      # a miss and not a wrong hit.
      - run: go test -race -count=1 -run 'TestResolveDir|TestPlatformDefaultDir|TestIsDefaultDir|TestIdentity|TestKeychain|TestReadIdentityRecord|TestListIdentityRecords|TestRemoveIdentityRecord|TestWriteIdentityRecord|TestWithIdentityLock|TestCredentialFingerprint|TestNewKeychainAccountID|TestBindingStamp|TestConfigWriteStamps|TestAConfigWriteReplaces|TestCanonicalDir|TestALoginResolvesOneBackendSet|TestTheFilePrePin|TestTransitionUnsafeOrUnreadable|TestWriteTransition|TestTheAutoRepinWritesNoPin|TestAnOldCopy|TestACreateOnlyDestination|TestActivationThatLosesTheManifest|TestAReaderDuringALogin|TestAStoreChange|TestAnAutoUpgradeStays|TestALoginThatNamesAStoreChangesOnly|TestTheReadPathNeverProbes|TestUnpinnedStore|TestTheBothStoresError|TestAnUnpinnedRead|TestAFailedLoginKeepsTheKeychainPrePin|TestDeleteLoginTokenOnAnUnpinned|TestAnUndisclosedPlaintext|TestALoginPassesATypedStoreError|TestALoginProceedsPastARemainingDelete|TestATerminalStepDoesNotRefuseAnotherCommand|TestPrepareMutationLetsALoginThrough|TestACredentialLeftInTheKeychain|TestTheLockRefusesAChangeIntoAStore|TestAnUpgradeOnAOneEntry|TestALoginCreatingAnEntry' ./internal/config/
      - run: go test -race -count=1 -run 'TestOneRelativeSpelling|TestOneDirectoryReachedBy|TestCopiedDirectory|TestHotPathOperationCounts|TestACrashBetweenTheTwoHalves' ./internal/token/

  e2e-windows:
    # The same suite as the e2e job, on the platform whose exec, path,
    # and credential-store semantics differ: the harness resolves
    # rancher.exe, pathmatch compares native separators, and scenario
    # skips gate what cannot occur here. Without this leg the suite's
    # Windows support can only regress silently between Windows runs.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Before checkout: the e2e goldens and txtar fixtures are
      # byte-compared, so a CRLF working tree fails them by
      # construction.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Cache envtest assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\kubebuilder-envtest
          key: envtest-${{ runner.os }}-${{ hashFiles('scripts/e2e') }}
      - run: bash scripts/e2e
        timeout-minutes: 25
