name: e2e-real

# Fidelity oracle: boots the digest-pinned rancher/rancher image in Docker
# and verifies the recorded goldens against it (~15 min). Too heavy for PRs:
# on-demand via workflow_dispatch, plus one weekly scheduled run to surface
# golden rot early.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# The oracle is a singleton (scripts/e2e-real holds a host lock); never run
# two at once, and never cancel a run that is mid-boot.
concurrency:
  group: e2e-real
  cancel-in-progress: false

jobs:
  fidelity-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The runner image ships with its root disk about 84% full. The
      # oracle's embedded k3s (and the downstream k3s) evict pods once the
      # disk has less than 10% free, and pulling the two images takes it
      # there. Remove toolchains this job never uses before booting.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
      # Record what the host has before boot so a starved run can be told
      # from a bug.
      - name: Host resources before boot
        run: df -h / && free -m && nproc
      - run: make e2e-real
