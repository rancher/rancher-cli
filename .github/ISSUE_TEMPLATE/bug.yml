name: Bug report
description: Report a bug in the CLI, the agent skill, the install script, the credential helper, or the documentation
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Remove tokens and passwords from anything you paste. Run the command with `-o json` to see the error code and hint, and include the command's exit code.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it (as minimally and precisely as possible)?
      description: |
        For example:
        1. Run `rancher get projects --cluster local -o wide`
        2. See this output: ...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        <details>

        ```console
        $ rancher --version
        # paste output here
        ```

        - Rancher server: <version>, community or Prime
        - Run by: a person at a terminal | a coding agent (harness: Claude Code, Codex, Copilot, other)
        - OS:

        </details>
