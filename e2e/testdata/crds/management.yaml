apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: settings.management.cattle.io
spec:
  group: management.cattle.io
  names: {kind: Setting, listKind: SettingList, plural: settings, singular: setting}
  scope: Cluster
  versions:
    - name: v3
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            # Rancher's real Setting carries its value TOP-LEVEL (a sibling
            # of spec/status, not nested under either) — without these two
            # properties, envtest's structural schema silently prunes any
            # seeded top-level value/default (PS-8 e2e coverage needs both).
            value:   {type: string}
            default: {type: string}
            spec:    {type: object, x-kubernetes-preserve-unknown-fields: true}
            status:  {type: object, x-kubernetes-preserve-unknown-fields: true}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: users.management.cattle.io
spec:
  group: management.cattle.io
  names: {kind: User, listKind: UserList, plural: users, singular: user}
  scope: Cluster
  versions:
    - name: v3
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        # User is Rancher-norman-style: displayName, principalIds, etc. live
        # directly on the object root, not under spec — preserve everything
        # so root-level fields round-trip like the real API.
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
          properties:
            spec:   {type: object, x-kubernetes-preserve-unknown-fields: true}
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
