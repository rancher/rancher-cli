# Machine-config CRDs for the e2e envtest cluster. Real shape: driver
# fields sit at the CR ROOT (rancher's dynamicschema publishes driver
# fields as top-level ResourceFields; there is NO spec wrapper).
# digitaloceanconfig carries the typed root fields so unknown-key pruning
# behaves like a real server (the pruned-key warning scenario); the other
# kinds preserve unknown root fields for --set-driven creates.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: amazonec2configs.rke-machine-config.cattle.io
spec:
  group: rke-machine-config.cattle.io
  names: {kind: Amazonec2Config, listKind: Amazonec2ConfigList, plural: amazonec2configs, singular: amazonec2config}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: azureconfigs.rke-machine-config.cattle.io
spec:
  group: rke-machine-config.cattle.io
  names: {kind: AzureConfig, listKind: AzureConfigList, plural: azureconfigs, singular: azureconfig}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: digitaloceanconfigs.rke-machine-config.cattle.io
spec:
  group: rke-machine-config.cattle.io
  names: {kind: DigitaloceanConfig, listKind: DigitaloceanConfigList, plural: digitaloceanconfigs, singular: digitaloceanconfig}
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            status: {type: object, x-kubernetes-preserve-unknown-fields: true}
            region: {type: string}
            size: {type: string}
            image: {type: string}
            tags: {type: string}
            userdata: {type: string}
            sshUser: {type: string}
            sshPort: {type: string}
            sshKeyFingerprint: {type: string}
            sshKeyContents: {type: string}
            backups: {type: boolean}
            ipv6: {type: boolean}
            monitoring: {type: boolean}
            privateNetworking: {type: boolean}
---
